<title>Forgeline: фабрика й оборона</title>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}

<body>
<canvas id="c"></canvas>
<div id="res" class="p"></div>
<div id="wave" class="p"><span id="wv"></span><div><button id="nx" aria-label="Наступна хвиля">⏩</button><button id="mn" aria-label="Сектори">☰</button></div></div>

<div id="menu" class="ov"><div class="p"><h2>Сектори</h2><div id="ml"></div><button id="mx">Закрити</button></div></div>
<script>
const W=64,H=64,TS=32,DX=[1,0,-1,0],DY=[0,1,0,-1];
const IT=['Мідь','Свинець','Пісок','Вугілля','Титан','Графіт','Кремній'],IC=['#d99d73','#8c7fa9','#d9c28a','#4b4e56','#8fb4d6','#a3a9b3','#6fd3c5'];
const HARD=[0,1,1,0,2,3];
const BT={
 conveyor:{n:'Конвеєр',cat:0,cost:{0:1},hp:45,sec:1},tconveyor:{n:'Титановий конвеєр',cat:0,cost:{0:1,1:1,4:1},hp:65,sec:4},junction:{n:'Перехрестя',cat:0,cost:{0:2},hp:50,sec:1},router:{n:'Маршрутизатор',cat:0,cost:{0:3},hp:50,sec:1},
 drill:{n:'Механічний бур',cat:1,w:2,h:2,cost:{0:12},hp:160,sec:1,tier:2,rate:.09},pdrill:{n:'Пневмобур (титан)',cat:1,w:2,h:2,cost:{0:18,5:10},hp:190,sec:4,tier:3,rate:.14},
 press:{n:'Графітний прес',cat:2,w:2,h:2,cost:{0:75,1:30},hp:200,sec:2},smelter:{n:'Кремнієва піч',cat:2,w:2,h:2,cost:{0:30,1:25},hp:220,sec:3},
 combustion:{n:'Генератор',cat:3,cost:{0:25,1:15},hp:100,sec:3},solar:{n:'Сонячна панель',cat:3,cost:{0:40,6:15},hp:80,sec:3},
 duo:{n:'Дуо',cat:4,cost:{0:35},hp:110,sec:1},hail:{n:'Град (земля)',cat:4,cost:{0:40,5:17},hp:130,sec:2},scatter:{n:'Скаттер (повітря)',cat:4,w:2,h:2,cost:{0:85,1:45},hp:200,sec:2},lancer:{n:'Лансер (енергія)',cat:4,w:2,h:2,cost:{0:100,1:50,6:45},hp:280,sec:4},
 cwall:{n:'Мідна стіна',cat:5,cost:{0:6},hp:320,sec:1},twall:{n:'Титанова стіна',cat:5,cost:{4:6},hp:440,sec:4},mender:{n:'Ремонтник',cat:5,cost:{1:30,0:10},hp:80,sec:2},
 core:{n:'Ядро',w:3,h:3,hp:1600}};
const CATS=['📦','⛏','🏭','⚡','🔫','🧱'];
const ET={dagger:{hp:120,spd:.8,r:4.5,d:8,cd:.6,fly:0},flare:{hp:60,spd:2.6,r:1.6,d:5,cd:.35,fly:1},mace:{hp:550,spd:.7,r:2.2,d:22,cd:.5,fly:0},horizon:{hp:340,spd:1.9,r:.9,d:30,cd:.6,fly:1}};
const SEC=[
 {n:'Нульова точка',seed:11,w:10,sc:1,ores:{1:3,2:3,3:2,4:2},res:[300]},
 {n:'Крижаний ліс',seed:23,w:15,sc:1.2,ores:{1:3,2:3,3:2,4:4},res:[400,100]},
 {n:'Кратери',seed:37,w:20,sc:1.4,ores:{1:3,2:3,3:4,4:3},res:[500,200,0,0,0,50,50]},
 {n:'Руїнні береги',seed:41,w:25,sc:1.6,ores:{1:3,2:3,3:3,4:3,5:2},res:[600,300,0,0,0,100,50]},
 {n:'Вітряні острови',seed:53,w:30,sc:1.8,ores:{1:3,2:3,3:3,4:3,5:3},res:[800,400,0,0,20,150,100]},
 {n:'Плямисті гори',seed:67,w:40,sc:2.1,ores:{1:3,2:3,3:3,4:4,5:4},res:[1000,500,0,0,50,200,150]}];
const SPS=[[5,5],[58,5],[5,58],[58,58]];
const $=id=>document.getElementById(id),cv=$('c'),cx=cv.getContext('2d');
/* ---------- карта ---------- */
let seed=7,SP=[5,5];const rnd=()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const hs=(x,y)=>{const v=Math.sin(x*127.1+y*311.7)*43758.5;return v-Math.floor(v)};
const gx=new Array(289).fill(0);
function vn(x,y){const xi=Math.floor(x),yi=Math.floor(y),u=x-xi,v=y-yi,g=(a,b)=>gx[((b%17+17)%17)*17+((a%17+17)%17)],s=u*u*(3-2*u),t=v*v*(3-2*v);return(g(xi,yi)*(1-s)+g(xi+1,yi)*s)*(1-t)+(g(xi,yi+1)*(1-s)+g(xi+1,yi+1)*s)*t}
const wall=new Uint8Array(W*H),ore=new Uint8Array(W*H),dist=new Int16Array(W*H);
const terr=document.createElement('canvas');terr.width=W*TS;terr.height=H*TS;
function flow(){dist.fill(-1);const q=[];for(let j=30;j<=32;j++)for(let i=30;i<=32;i++){dist[j*W+i]=0;q.push([i,j])}
 for(let h=0;h<q.length;h++){const[x,y]=q[h];for(let d=0;d<8;d++){const nx=x+[1,0,-1,0,1,1,-1,-1][d],ny=y+[0,1,0,-1,1,-1,1,-1][d];if(nx<0||ny<0||nx>=W||ny>=H||wall[ny*W+nx]||dist[ny*W+nx]>=0)continue;if(d>3&&(wall[y*W+nx]||wall[ny*W+x]))continue;dist[ny*W+nx]=dist[y*W+x]+1;q.push([nx,ny])}}}
function genMap(s,idx){seed=s.seed;for(let i=0;i<289;i++)gx[i]=rnd();SP=SPS[idx%4];wall.fill(0);ore.fill(0);
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){const n=vn(x/6,y/6)*.65+vn(x/3,y/3)*.35,dc=Math.hypot(x-32,y-32),ds=Math.hypot(x-SP[0],y-SP[1]);if(x<1||y<1||x>W-2||y>H-2||(n>.62&&dc>9&&ds>8))wall[y*W+x]=1}
 for(const c in s.ores)for(let n=0;n<s.ores[c];n++){const a=rnd()*6.28,d=(6+rnd()*14)*(c>=4?1.25:1),cx0=Math.min(58,Math.max(5,32+Math.cos(a)*d)),cy0=Math.min(58,Math.max(5,32+Math.sin(a)*d)),r=2+rnd()*1.6;
  for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++)if(Math.hypot(x-cx0,y-cy0)<r+(hs(x,y)-.5)*1.5){ore[y*W+x]=+c;wall[y*W+x]=0}}
 flow();if(dist[SP[1]*W+SP[0]]<0){let x=SP[0],y=SP[1];while(x!==32||y!==32){for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++){const a=x+i,b=y+j;if(a>0&&b>0&&a<W-1&&b<H-1)wall[b*W+a]=0}x+=Math.sign(32-x);if(Math.abs(32-y)>0&&hs(x,y)>.4)y+=Math.sign(32-y)}flow()}
 paint()}
function paint(){const c=terr.getContext('2d');
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=y*W+x,px=x*TS,py=y*TS,h=hs(x,y);
  if(wall[i]){c.fillStyle='#262a30';c.fillRect(px,py,TS,TS);c.fillStyle='#32363d';c.fillRect(px+2,py+2,TS-4,TS-6);c.fillStyle='#3d4249';c.fillRect(px+2,py+2,TS-4,5);
   for(let k=0;k<4;k++){c.fillStyle=hs(x+k,y*3)>.5?'#2b2f35':'#383d44';c.fillRect(px+4+hs(x,y+k)*20,py+8+hs(y,x+k)*14,5,4)}continue}
  c.fillStyle=ore[i]===3?'#7b6d4c':['#33363c','#363940','#383b42'][(h*3)|0];c.fillRect(px,py,TS,TS);
  c.fillStyle='rgba(0,0,0,.18)';c.fillRect(px,py,TS,1);c.fillRect(px,py,1,TS);
  for(let k=0;k<5;k++){c.fillStyle=ore[i]===3?'#8e7f5a':'rgba(255,255,255,.04)';c.fillRect(px+hs(x+k,y)*28,py+hs(y+k,x)*28,3,3)}
  if(ore[i]&&ore[i]!==3){const col=IC[ore[i]-1];for(let k=0;k<7;k++){const ox=px+3+hs(x*7+k,y)*22,oy=py+3+hs(y*5+k,x)*22,s=4+hs(k,x+y)*4;c.fillStyle='rgba(0,0,0,.35)';c.fillRect(ox+1,oy+1,s,s);c.fillStyle=col;c.fillRect(ox,oy,s,s);c.fillStyle='rgba(255,255,255,.28)';c.fillRect(ox,oy,s,1.5)}}}}
/* ---------- стан ---------- */
let grid,B,E,FX,sq,res,wave,timer,state,time=0,si=0,target=10,pw={p:0,u:0,s:1},unl=1,P={x:32,y:32,a:0,cd:0},mine=null,mt=0;
let cam={x:32,y:32,z:innerWidth<700?36:42},tool='pan',sel=null,cat=0,rot=0,hov=null;
try{unl=Math.max(1,Math.min(SEC.length,+localStorage.getItem('forgeline2')||1))}catch(e){}
function reset(i){si=i;const s=SEC[i];genMap(s,i);grid=new Array(W*H).fill(null);B=[];E=[];FX=[];sq=[];res=[0,0,0,0,0,0,0];s.res.forEach((v,k)=>res[k]=v);wave=0;timer=60;state='play';target=s.w;
 $('over').style.display='none';mk('core',30,30,0);P.x=P.y=32;cam.x=cam.y=32;buildBar();ui()}
function mk(t,x,y,r){const d=BT[t],b={t,x,y,r:r||0,w:d.w||1,h:d.h||1,hp:d.hp,mh:d.hp,di:0,an:0,pm:null,cd:0,pr:0,ang:0,rc:0};
 if(t==='tconveyor'){b.t='conveyor';b.fast=1;b.id=t}if(b.t==='conveyor')b.q=[];if(t==='router'){b.it=-1;b.t0=0;b.fr=null}if(t==='junction')b.buf=[[],[],[],[]];
 if(d.tier){const c=[0,0,0,0,0,0];for(let j=0;j<4;j++){const o=ore[(y+(j>>1))*W+x+(j&1)];if(o&&HARD[o]<=d.tier)c[o]++}let k=1;for(let i=2;i<6;i++)if(c[i]>c[k])k=i;b.k=k-1;b.rate=c[k]*d.rate*(1-.12*HARD[k]);b.n=0;b.tm=0}
 if(t==='press'){b.c=0;b.g=0}if(t==='smelter'){b.c=0;b.s=0;b.si=0}if(t==='combustion'){b.cn=0;b.burn=0}if(t==='duo'||t==='hail'||t==='scatter'){b.am=0;b.ak=0}
 for(let j=0;j<b.h;j++)for(let i=0;i<b.w;i++)grid[(y+j)*W+x+i]=b;B.push(b);return b}
function rm(b){for(let j=0;j<b.h;j++)for(let i=0;i<b.w;i++)grid[(b.y+j)*W+b.x+i]=null;B.splice(B.indexOf(b),1)}
function hurt(b,d){b.hp-=d;if(b.hp<=0){snd('boom');FX.push({x:b.x+b.w/2,y:b.y+b.h/2,l:.5,r:b.w});rm(b);if(b.t==='core')finish(false)}}
const DIST=['conveyor','tconveyor','router','junction'];
function can(t,x,y){const d=BT[t],w=d.w||1,h=d.h||1;if(x<0||y<0||x+w>W||y+h>H)return false;let o=0;
 for(let j=0;j<h;j++)for(let i=0;i<w;i++){const q=(y+j)*W+x+i,g=grid[q];if(wall[q])return false;if(g&&!(DIST.includes(t)&&DIST.includes(g.t)))return false;if(ore[q]&&(!d.tier||HARD[ore[q]]<=d.tier))o++}
 return!d.tier||o>0}
const afford=t=>Object.entries(BT[t].cost).every(([i,c])=>res[i]>=c);
const near=(x,y,r)=>Math.hypot(P.x-x,P.y-y)<=r;
function place(t,x,y,r){if(!near(x,y,22))return null;const g=grid[y*W+x];
 if(g&&(t==='conveyor'||t==='tconveyor')&&g.t==='conveyor'){g.r=r;return g}
 if(!can(t,x,y)||!afford(t))return null;
 if(g)rm(g);for(const i in BT[t].cost)res[i]-=BT[t].cost[i];snd('place');return mk(t,x,y,r)}
function erase(x,y){const g=grid[y*W+x];if(g&&g.t!=='core'){const d=BT[g.id||g.t];for(const i in d.cost)res[i]+=d.cost[i];rm(g)}}
/* ---------- логістика ---------- */
function acc(b,k,from){switch(b.t){
 case'core':return res[k]<4000;
 case'conveyor':if(b.q.length>=4||(b.q.length&&b.q[b.q.length-1].p<.3))return false;return!(from&&grid[(b.y+DY[b.r])*W+b.x+DX[b.r]]===from);
 case'router':return b.it<0;
 case'junction':for(let d=0;d<4;d++)if(grid[(b.y+DY[d])*W+b.x+DX[d]]===from)return b.buf[(d+2)%4].length<6;return false;
 case'press':return k===3&&b.c<10;
 case'smelter':return(k===3&&b.c<6)||(k===2&&b.s<12);
 case'combustion':return k===3&&b.cn<5;
 case'duo':return(k===0||k===5||k===6)&&b.am<24;
 case'hail':return k===5&&b.am<12;
 case'scatter':return k===1&&b.am<24}return false}
function give(b,k,from){switch(b.t){case'core':res[k]++;break;case'conveyor':b.q.push({k,p:0});break;case'router':b.it=k;b.fr=from;b.t0=0;break;
 case'junction':for(let d=0;d<4;d++)if(grid[(b.y+DY[d])*W+b.x+DX[d]]===from)b.buf[(d+2)%4].push({k,t:0});break;
 case'press':case'combustion':b.t==='press'?b.c++:b.cn++;break;case'smelter':k===3?b.c++:b.s++;break;default:b.am+=2;b.ak=k}}
function perim(b){if(b.pm)return b.pm;const p=[];for(let i=0;i<b.w;i++)p.push([b.x+i,b.y-1],[b.x+i,b.y+b.h]);for(let j=0;j<b.h;j++)p.push([b.x-1,b.y+j],[b.x+b.w,b.y+j]);return b.pm=p.filter(a=>a[0]>=0&&a[1]>=0&&a[0]<W&&a[1]<H)}
function dump(b,k){const p=perim(b);for(let n=0;n<p.length;n++){const q=p[(b.di+n)%p.length],t=grid[q[1]*W+q[0]];if(t&&t!==b&&acc(t,k,b)){give(t,k,b);b.di=(b.di+n+1)%p.length;return true}}return false}
const nearE=(x,y,r,m)=>{let o=null,bd=r*r;for(const e of E){if(m==='g'&&e.fly||m==='a'&&!e.fly)continue;const d=(e.x-x)**2+(e.y-y)**2;if(d<bd){bd=d;o=e}}return o};
const nearB=(x,y,r)=>{let o=null,bd=r*r;for(const b of B){const d=(b.x+b.w/2-x)**2+(b.y+b.h/2-y)**2;if(d<bd){bd=d;o=b}}return o};
function zap(x,y,e,d,col,r,m){snd('shot');FX.push({ln:1,x,y,x2:e.x,y2:e.y,l:.1,c:col});for(const q of E){if(q===e||(r&&(q.x-e.x)**2+(q.y-e.y)**2<r*r&&!(m==='g'&&q.fly)&&!(m==='a'&&!q.fly)))q.hp-=d}if(r)FX.push({x:e.x,y:e.y,l:.3,r:.8})}
function upB(b,dt){switch(b.t){
 case'conveyor':{const q=b.q;for(let i=0;i<q.length;i++){const lim=i?q[i-1].p-.3:1;q[i].p=Math.max(q[i].p,Math.min(q[i].p+dt*(b.fast?6:3),lim))}

/* ---------- звук, пауза, збереження ---------- */
let AC=null,mute=false,paused=false;const lastS={};
function snd(k){if(mute||!AC)return;const n=AC.currentTime,L={place:[520,.06,'square',.05],shot:[880,.04,'square',.025],boom:[90,.25,'sawtooth',.08],wave:[110,.5,'sawtooth',.07]}[k];if(!L||(lastS[k]||0)>n-(k==='shot'?.07:.03))return;lastS[k]=n;const o=AC.createOscillator(),g=AC.createGain();o.type=L[2];o.frequency.setValueAtTime(L[0],n);if(k==='boom')o.frequency.exponentialRampToValueAtTime(40,n+L[1]);g.gain.setValueAtTime(L[3],n);g.gain.exponentialRampToValueAtTime(.0001,n+L[1]);o.connect(g);g.connect(AC.destination);o.start(n);o.stop(n+L[1])}
addEventListener('pointerdown',()=>{if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume()});
const SK='forgeline-save-v1',FL=['hp','c','g','s','si','am','ak','cn','burn','n','tm','it','q','buf','cd'];
const hasSave=()=>{try{return!!localStorage.getItem(SK)}catch(e){return false}};
function saveGame(){if(state!=='play'||(B.length<2&&wave===0))return;try{localStorage.setItem(SK,JSON.stringify({si,wave,timer,target,res,B:B.map(b=>{const f={};FL.forEach(k=>{if(b[k]!==undefined)f[k]=b[k]});return{t:b.id||b.t,x:b.x,y:b.y,r:b.r,f}})}))}catch(e){}}
function loadGame(){try{const v=JSON.parse(localStorage.getItem(SK));if(!v)return false;reset(v.si);grid.fill(null);B=[];v.B.forEach(r=>{const b=mk(r.t,r.x,r.y,r.r);Object.assign(b,r.f)});res=v.res;wave=v.wave;timer=v.timer;target=v.target;return true}catch(e){return false}}
function hint(){if(si!==0||wave>1)return'';const has=t=>B.some(b=>b.t===t);if(!has('drill'))return'Обери ⛏ → Механічний бур і постав на мідну руду (оранжева)';if(!has('conveyor'))return'Проведи конвеєр 📦 від бура до ядра (тягни пальцем)';if(!has('duo'))return'Постав турель 🔫 Дуо й підведи до неї мідь';return''}
/* ---------- інтерфейс ---------- */
const sqr=i=>`<i class="sq" style="background:${IC[i]}"></i>`;
const costS=d=>Object.entries(d.cost).map(([i,c])=>sqr(i)+c).join(' ');
function toast(t){const x=$('toast');x.textContent=t;x.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>x.style.display='none',2800)}
function buildBar(){const bar=$('bar');bar.innerHTML='';
 Object.keys(BT).filter(t=>t!=='core'&&BT[t].cat===cat).forEach(t=>{const b=document.createElement('button'),d=BT[t],lock=d.sec>unl;b.dataset.t=t;if(lock)b.className='lk';
  const c=document.createElement('canvas');c.width=c.height=80;const g=c.getContext('2d'),s=70/(32*Math.max(d.w||1,d.h||1));g.translate(5,5);g.scale(s,s);
  drawB(g,{t,x:0,y:0,r:0,w:d.w||1,h:d.h||1,hp:1,mh:1,q:[],ang:-Math.PI/2,k:0,an:.4,rc:0,it:-1,c:0,g:0,s:0,si:0,pr:0,burn:0,cd:1},0);b.appendChild(c);if(lock){const l=document.createElement('b');l.textContent='🔒'+d.sec;b.appendChild(l)}
  b.onclick=()=>{if(lock){toast('Відкриється в секторі '+d.sec);return}tool=t;ui()};bar.appendChild(b)});
 $('cats').innerHTML='';CATS.forEach((e,i)=>{const b=document.createElement('button');b.textContent=e;b.className=i===cat?'on':'';b.onclick=()=>{cat=i;buildBar();ui()};$('cats').appendChild(b)})}
const TL=[['pan','✋'],['mine','⛏'],['rot','⟳'],['del','🗑'],['pause','⏸'],['snd','🔊']];
TL.forEach(([t,e])=>{const b=document.createElement('button');b.textContent=e;b.dataset.t=t;b.onclick=()=>{if(t==='rot'){rot=(rot+1)%4;ui();return}if(t==='pause'){paused=!paused;b.textContent=paused?'▶':'⏸';return}if(t==='snd'){mute=!mute;b.textContent=mute?'🔇':'🔊';return}tool=t;ui()};$('tools').appendChild(b)});
function ui(){document.querySelectorAll('#bar button,#tools button').forEach(b=>b.classList.toggle('on',b.dataset.t===tool));
 const inf=$('info');if(BT[tool]){inf.style.display='block';inf.innerHTML=BT[tool].n+' · '+costS(BT[tool])+' · '+['→','↓','←','↑'][rot]}else if(tool==='del'){inf.style.display='block';inf.textContent='Прибрати (повертає ресурси)'}else if(tool==='mine'){inf.style.display='block';inf.textContent='Тримай палець на руді поруч'}else inf.style.display='none';
 $('res').innerHTML=IT.map((n,i)=>`<span title="${n}">${sqr(i)}${Math.floor(res[i])}</span>`).join('')+`<span>⚡${pw.p.toFixed(1)}/${pw.u.toFixed(1)}</span>`;
 $('wv').textContent=SEC[si].n+' · '+wave+'/'+(target>1e8?'∞':target)+' · '+Math.max(0,Math.ceil(timer))+'с';const h=hint();$('hint').style.display=h?'block':'none';$('hint').textContent=h}
function openMenu(){$('ml').innerHTML='';if(hasSave()){const c=document.createElement('button');c.textContent='▶ Продовжити збережену гру';c.onclick=()=>{$('menu').style.display='none';loadGame();ui()};$('ml').appendChild(c)}SEC.forEach((s,i)=>{const b=document.createElement('button'),ok=i<unl;b.textContent=(ok?'':'🔒 ')+(i+1)+'. '+s.n+' · '+s.w+' хв.';if(!ok)b.className='lk';b.onclick=()=>{if(!ok){toast('Спочатку захопи попередній сектор');return}$('menu').style.display='none';reset(i)};$('ml').appendChild(b)});$('menu').style.display='grid'}
$('mn').onclick=openMenu;$('mx').onclick=()=>$('menu').style.display='none';$('nx').onclick=()=>{if(state==='play'&&wave<target)callWave()};
/* ---------- керування ---------- */
const ps=new Map();let last=null,pd=0,joyId=null;
const tileAt=(x,y)=>{const w=s2w(x,y);return[Math.floor(w[0]),Math.floor(w[1])]};
function act(x,y){const[tx,ty]=tileAt(x,y);hov=[tx,ty];if(tx<0||ty<0||tx>=W||ty>=H)return;
 if(tool==='mine'){mine=[tx,ty];return}
 if(tool==='del')erase(tx,ty);
 else if(BT[tool]){let r=rot;if((tool==='conveyor'||tool==='tconveyor')&&last&&(last[0]!==tx||last[1]!==ty)){const dx=tx-last[0],dy=ty-last[1];if(Math.abs(dx)+Math.abs(dy)===1){r=dx?(dx>0?0:2):(dy>0?1:3);rot=r;const p=grid[last[1]*W+last[0]];if(p&&p.t==='conveyor')p.r=r}}
  if(!last||last[0]!==tx||last[1]!==ty){place(tool,tx,ty,r);last=[tx,ty]}}}
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ps.set(e.pointerId,{x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY});last=null;
 if(ps.size===2){const v=[...ps.values()];pd=Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y);mine=null}else act(e.clientX,e.clientY)});
cv.addEventListener('pointermove',e=>{const p=ps.get(e.pointerId);hov=tileAt(e.clientX,e.clientY);if(!p)return;p.x=e.clientX;p.y=e.clientY;
 if(ps.size===2){const v=[...ps.values()],d=Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y);if(pd)cam.z=Math.min(90,Math.max(16,cam.z*d/pd));pd=d}else act(e.clientX,e.clientY)});
function up(e){const p=ps.get(e.pointerId);ps.delete(e.pointerId);last=null;mine=null;
 if(p&&tool==='pan'&&ps.size===0&&Math.hypot(e.clientX-p.sx,e.clientY-p.sy)<10){const[tx,ty]=tileAt(e.clientX,e.clientY),g=grid[ty*W+tx];if(g&&g.t==='conveyor')g.r=(g.r+1)%4}}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('wheel',e=>{e.preventDefault();cam.z=Math.min(90,Math.max(16,cam.z*(1-e.deltaY*.001)))},{passive:false});
const joy=$('joy'),kn=$('knob');
function jset(e){const r=joy.getBoundingClientRect(),m=r.width/2;let dx=e.clientX-(r.left+m),dy=e.clientY-(r.top+m);const d=Math.hypot(dx,dy);if(d>m){dx*=m/d;dy*=m/d}J.x=dx/m;J.y=dy/m;kn.style.transform=`translate(${dx}px,${dy}px)`}
joy.onpointerdown=e=>{joyId=e.pointerId;joy.setPointerCapture(joyId);jset(e)};joy.onpointermove=e=>{if(e.pointerId===joyId)jset(e)};
joy.onpointerup=joy.onpointercancel=e=>{if(e.pointerId===joyId){joyId=null;J.x=J.y=0;kn.style.transform=''}};
addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=true;if(k==='r'){rot=(rot+1)%4;ui()}if(k==='q'){tool='pan';ui()}});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
/* ---------- цикл ---------- */
reset(0);openMenu();
let lt=performance.now(),ac=0,sv=0;
function loop(n){requestAnimationFrame(loop);const dt=Math.min((n-lt)/1000,.1);lt=n;
 if($('menu').style.display!=='grid'&&!paused)step(dt)
 cam.x+=(P.x-cam.x)*Math.min(1,dt*6);cam.y+=(P.y-cam.y)*Math.min(1,dt*6);
 ac+=dt;sv+=dt;if(sv>5){sv=0;saveGame()}if(ac>.2){ac=0;ui()}draw()}
addEventListener('visibilitychange',()=>{if(document.hidden)saveGame()});
requestAnimationFrame(loop);
</script>
